<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b0e">
<title>Wine Trip</title>
<style>
  :root{
    --bg:#100b0e;
    --card:#171015;
    --card-edge:#241a20;
    --ink:#efe7e3;
    --muted:#8a7f86;
    --green:#38e08c;
    --cyan:#3fd2e6;
    --gold:#ffcf3f;
    --gold-dim:#4a4048;
    --danger:#e0534f;
    --field:#0c0709;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}

  header.top{margin:6px 2px 22px}
  header.top h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:1.9rem;
    letter-spacing:.3px;
    margin:0;
  }
  header.top p{margin:4px 0 0;color:var(--muted);font-size:.85rem}

  /* Inputs / buttons */
  .addbar{display:flex;gap:8px;margin-bottom:26px}
  input[type=text]{
    flex:1;min-width:0;
    background:var(--field);
    border:1px solid var(--card-edge);
    color:var(--ink);
    font-size:16px; /* prevents iOS zoom */
    padding:12px 14px;
    border-radius:12px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]::placeholder{color:#5f555b}
  input[type=text]:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(56,224,140,.15)}
  .wine-add input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,210,230,.15)}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{
    padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:600;
    border:1px solid var(--card-edge);background:#1d151b;color:var(--ink);white-space:nowrap;
    transition:transform .08s,background .15s,border-color .15s;
  }
  .btn:active{transform:scale(.96)}
  .btn-green{border-color:rgba(56,224,140,.5);color:var(--green)}
  .btn-cyan{border-color:rgba(63,210,230,.45);color:var(--cyan)}

  /* Winery card */
  .winery{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:18px;
    padding:16px 16px 14px;
    margin-bottom:16px;
  }
  .winery-head{display:flex;align-items:flex-start;gap:10px}
  .winery-name{
    flex:1;min-width:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:1.4rem;line-height:1.2;color:var(--ink);
    word-break:break-word;
  }
  .rule{height:3px;border-radius:3px;margin:8px 0 12px;
        background:linear-gradient(90deg,var(--green),rgba(56,224,140,.05))}
  .avg{
    display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
    background:rgba(255,207,63,.1);border:1px solid rgba(255,207,63,.25);
    color:var(--gold);font-size:.82rem;font-weight:700;
    padding:5px 10px;border-radius:999px;margin-top:3px;
  }
  .avg .n{color:var(--muted);font-weight:500}
  .x{
    flex-shrink:0;color:var(--muted);font-size:1.25rem;line-height:1;
    padding:4px 6px;border-radius:8px;margin-top:2px;
  }
  .x:hover,.x:active{color:var(--danger)}

  /* Wine row */
  .wine{
    display:flex;align-items:center;gap:8px;
    padding:9px 2px;border-top:1px solid #201720;
  }
  .wine:first-child{border-top:none}
  .wine-name{flex:1;min-width:0;color:var(--cyan);font-weight:500;word-break:break-word}
  .stars{display:flex;flex-shrink:0}
  .star{
    font-size:1.55rem;line-height:1;color:var(--gold-dim);
    padding:4px 3px;transition:transform .08s,color .12s;
  }
  .star.on{color:var(--gold)}
  .star:active{transform:scale(1.25)}

  .wine-add{display:flex;gap:8px;margin-top:12px}
  .wine-add input{padding:10px 12px}

  .empty{color:var(--muted);font-size:.9rem;font-style:italic;padding:6px 2px 2px}
  .empty-top{
    text-align:center;color:var(--muted);border:1px dashed var(--card-edge);
    border-radius:16px;padding:28px 16px;font-size:.95rem;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Wine Trip</h1>
    <p>Log a winery, add its pours, tap to rate. Saved on this device.</p>
  </header>

  <div class="addbar">
    <input type="text" id="wineryInput" placeholder="Winery name" autocomplete="off">
    <button class="btn btn-green" id="addWineryBtn">Add winery</button>
  </div>

  <div id="list"></div>
</div>

<script>
"use strict";

const KEY = "wineTrip.v1";
const listEl = document.getElementById("list");
const wineryInput = document.getElementById("wineryInput");

let data = load();
const drafts = {};            // wineryId -> draft wine name
let newWineryDraft = "";
let focusWineInput = null;    // wineryId to focus after render

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return { wineries: [] };
    const parsed = JSON.parse(raw);
    return parsed && Array.isArray(parsed.wineries) ? parsed : { wineries: [] };
  }catch(e){ return { wineries: [] }; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ /* storage full or blocked; app still works this session */ }
}
function uid(){
  return (crypto.randomUUID && crypto.randomUUID()) ||
         (Date.now().toString(36) + Math.random().toString(36).slice(2));
}
function avgOf(w){
  const rated = w.wines.filter(x => x.stars > 0);
  if(!rated.length) return null;
  return rated.reduce((s,x)=>s+x.stars,0) / rated.length;
}
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

/* ---- actions ---- */
function addWinery(){
  const name = wineryInput.value.trim();
  if(!name) return;
  const id = uid();
  data.wineries.unshift({ id, name, wines: [] });
  wineryInput.value = "";
  newWineryDraft = "";
  save();
  focusWineInput = id;
  render();
}
function deleteWinery(id){
  const w = data.wineries.find(x=>x.id===id);
  const has = w && w.wines.length;
  if(has && !confirm(`Delete "${w.name}" and its ${w.wines.length} wine(s)?`)) return;
  data.wineries = data.wineries.filter(x=>x.id!==id);
  delete drafts[id];
  save(); render();
}
function addWine(wineryId){
  const name = (drafts[wineryId] || "").trim();
  if(!name) return;
  const w = data.wineries.find(x=>x.id===wineryId);
  if(!w) return;
  w.wines.push({ id: uid(), name, stars: 0 });
  drafts[wineryId] = "";
  save();
  focusWineInput = wineryId;
  render();
}
function deleteWine(wineryId, wineId){
  const w = data.wineries.find(x=>x.id===wineryId);
  if(!w) return;
  w.wines = w.wines.filter(x=>x.id!==wineId);
  save(); render();
}
function rate(wineryId, wineId, value){
  const w = data.wineries.find(x=>x.id===wineryId);
  const wine = w && w.wines.find(x=>x.id===wineId);
  if(!wine) return;
  wine.stars = (wine.stars === value) ? 0 : value; // tap same star to un-rate
  save(); render();
}

/* ---- render ---- */
function render(){
  wineryInput.value = newWineryDraft;
  listEl.innerHTML = "";

  if(!data.wineries.length){
    listEl.appendChild(el("div","empty-top","No wineries yet. Add the one you're tasting at."));
    return;
  }

  data.wineries.forEach(w => {
    const card = el("div","winery");

    // head: name + avg + delete
    const head = el("div","winery-head");
    head.appendChild(el("div","winery-name", w.name));

    if(w.wines.length){
      const avg = avgOf(w);
      const badge = el("div","avg");
      badge.appendChild(el("span",null,"★"));
      badge.appendChild(el("span",null, avg==null ? "—" : avg.toFixed(1)));
      const n = w.wines.length;
      badge.appendChild(el("span","n", ` · ${n} wine${n>1?"s":""}`));
      head.appendChild(badge);
    }

    const del = el("button","x","×");
    del.title = "Delete winery";
    del.setAttribute("aria-label","Delete winery");
    del.onclick = () => deleteWinery(w.id);
    head.appendChild(del);
    card.appendChild(head);

    card.appendChild(el("div","rule"));

    // wines
    if(!w.wines.length){
      card.appendChild(el("div","empty","No wines yet — add your first pour."));
    }else{
      w.wines.forEach(wine => {
        const row = el("div","wine");
        row.appendChild(el("div","wine-name", wine.name));

        const stars = el("div","stars");
        for(let v=1; v<=5; v++){
          const s = el("span", "star" + (v <= wine.stars ? " on" : ""), "★");
          s.setAttribute("role","button");
          s.setAttribute("aria-label", v + " star" + (v>1?"s":""));
          s.onclick = () => rate(w.id, wine.id, v);
          stars.appendChild(s);
        }
        row.appendChild(stars);

        const wdel = el("button","x","×");
        wdel.title = "Delete wine";
        wdel.setAttribute("aria-label","Delete wine");
        wdel.onclick = () => deleteWine(w.id, wine.id);
        row.appendChild(wdel);

        card.appendChild(row);
      });
    }

    // add wine
    const add = el("div","wine-add");
    const inp = el("input");
    inp.type = "text";
    inp.placeholder = "Wine + variety (e.g. Malbec Reserva)";
    inp.autocomplete = "off";
    inp.value = drafts[w.id] || "";
    inp.oninput = () => { drafts[w.id] = inp.value; };
    inp.onkeydown = e => { if(e.key === "Enter") addWine(w.id); };
    inp.dataset.wineryId = w.id;
    const addBtn = el("button","btn btn-cyan","Add wine");
    addBtn.onclick = () => addWine(w.id);
    add.appendChild(inp);
    add.appendChild(addBtn);
    card.appendChild(add);

    listEl.appendChild(card);
  });

  // restore focus to the winery we just acted on
  if(focusWineInput){
    const target = listEl.querySelector(`input[data-winery-id="${focusWineInput}"]`);
    if(target){ target.focus(); }
    focusWineInput = null;
  }
}

/* ---- wire up top bar ---- */
wineryInput.oninput = () => { newWineryDraft = wineryInput.value; };
wineryInput.onkeydown = e => { if(e.key === "Enter") addWinery(); };
document.getElementById("addWineryBtn").onclick = addWinery;

render();
</script>
</body>
</html>
